name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: isthatpratham

      - name: Recolor contribution graph
        run: |
          python3 << 'EOF'
          from pathlib import Path

          svg = Path("profile-3d-contrib/profile-night-view.svg")

          text = svg.read_text()

          replacements = {
              "#9be9a8": "#ffd6b3",
              "#40c463": "#ffb347",
              "#30a14e": "#ff6b35",
              "#216e39": "#d90429",
              "#ebedf0": "#1b1b1b",
              "#161b22": "#0d1117"
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          svg.write_text(text)
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add profile-3d-contrib

          git diff --cached --quiet || git commit -m "Update profile-3d-contrib [skip ci]"

          git push
