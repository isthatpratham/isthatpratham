name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: isthatpratham

      - name: Recolor contribution graph
        run: |
          python3 << 'EOF'
          from pathlib import Path

          svg = Path("profile-3d-contrib/profile-night-view.svg")

          if not svg.exists():
              print("SVG not found:", svg)
              raise SystemExit(1)

          text = svg.read_text(encoding="utf-8")

          replacements = {
              # Top faces
              "rgb(25, 165, 240)": "rgb(255, 180, 71)",
              "rgb(25, 150, 230)": "rgb(255, 150, 50)",
              "rgb(25, 120, 220)": "rgb(255, 107, 53)",
              "rgb(25, 90, 210)":  "rgb(217, 4, 41)",

              # Left faces
              "rgb(21, 138, 201)": "rgb(230, 120, 40)",
              "rgb(21, 125, 192)": "rgb(220, 90, 35)",
              "rgb(21, 100, 184)": "rgb(180, 30, 30)",
              "rgb(21, 75, 176)":  "rgb(140, 0, 0)",

              # Right faces
              "rgb(18, 115, 168)": "rgb(200, 70, 30)",
              "rgb(18, 105, 161)": "rgb(180, 45, 25)",
              "rgb(18, 84, 154)":  "rgb(150, 20, 20)",
              "rgb(18, 63, 147)":  "rgb(120, 0, 0)",

              # Dark edges
              "rgb(25, 60, 130)":  "rgb(120, 25, 15)",
              "rgb(21, 50, 109)":  "rgb(90, 15, 10)",
              "rgb(18, 42, 91)":   "rgb(60, 10, 5)"
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          svg.write_text(text, encoding="utf-8")

          print("✅ Recolored profile-night-view.svg")
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add profile-3d-contrib

          if ! git diff --cached --quiet; then
            git commit -m "Update profile-3d-contrib [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
